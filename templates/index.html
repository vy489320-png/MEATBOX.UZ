<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEATBOX.UZ — Premium Go'sht Do'koni</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0A0A0E;
            --bg-card: rgba(22, 22, 30, 0.75);
            --bg-card-solid: #16161E;
            --bg-input: rgba(255, 255, 255, 0.05);
            
            --ruby-primary: #C90B0B;
            --ruby-dark: #7A0404;
            --ruby-grad: linear-gradient(135deg, #E50914 0%, #9B0000 100%);
            
            --gold-primary: #FFD700;
            --gold-light: #FFE566;
            --gold-grad: linear-gradient(135deg, #FFD700 0%, #FFA800 100%);
            
            --text-main: #FFFFFF;
            --text-sub: #A0A0B0;
            --text-muted: #6B6B7B;
            
            --border-glow: rgba(255, 215, 0, 0.2);
            --border-subtle: rgba(255, 255, 255, 0.07);
            
            --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 20px rgba(201, 11, 11, 0.35);
            
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding-bottom: 110px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(201, 11, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 215, 0, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* HEADER & SEARCH BAR */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 16px 10px 16px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-emblem {
            width: 42px;
            height: 42px;
            background: var(--ruby-grad);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow-glow);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 0.5px;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .brand-tagline {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 500;
            margin-top: 3px;
        }

        .delivery-pill {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.25);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--gold-primary);
        }

        /* SEARCH INPUT */
        .search-box {
            position: relative;
            margin-top: 4px;
        }

        .search-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            padding: 10px 16px 10px 42px;
            border-radius: 14px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: var(--text-muted);
        }

        /* HERO SLIDER / BANNERS */
        .hero-banner-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 16px;
            scrollbar-width: none;
        }

        .hero-banner-slider::-webkit-scrollbar { display: none; }

        .banner-card {
            min-width: 280px;
            height: 125px;
            border-radius: var(--radius-lg);
            padding: 16px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(135deg, #800000 0%, #300000 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .banner-card:nth-child(2) {
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .banner-title {
            font-size: 16px;
            font-weight: 800;
            color: #FFF;
            margin-bottom: 4px;
            z-index: 2;
        }

        .banner-subtitle {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 600;
            z-index: 2;
        }

        .banner-badge {
            display: inline-block;
            background: var(--gold-grad);
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            width: fit-content;
            margin-top: 8px;
            z-index: 2;
        }

        .banner-emoji {
            position: absolute;
            right: -10px;
            bottom: -15px;
            font-size: 80px;
            opacity: 0.25;
            transform: rotate(-15deg);
        }

        /* CATEGORIES TABS */
        .categories-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 16px 12px 16px;
            scrollbar-width: none;
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .cat-chip {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-chip.active {
            background: var(--ruby-grad);
            color: #FFF;
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(201, 11, 11, 0.4);
            transform: translateY(-1px);
        }

        /* PRODUCTS SECTION */
        .products-container {
            padding: 0 16px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 14px;
        }

        .prod-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .prod-card:active {
            transform: scale(0.97);
        }

        .prod-thumb-box {
            position: relative;
            width: 100%;
            height: 135px;
            background: #181822;
            overflow: hidden;
        }

        .prod-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .prod-card:hover .prod-thumb {
            transform: scale(1.08);
        }

        .prod-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(10, 10, 14, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(6px);
            color: var(--gold-primary);
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 8px;
        }

        .prod-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .prod-title {
            font-size: 14px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 4px;
        }

        .prod-desc {
            font-size: 11px;
            color: var(--text-sub);
            line-height: 1.35;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .prod-bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            margin-top: auto;
        }

        .prod-price {
            font-size: 14px;
            font-weight: 900;
            color: var(--gold-primary);
            letter-spacing: -0.2px;
        }

        /* BUTTONS */
        .btn-add {
            background: var(--ruby-grad);
            color: #FFF;
            border: none;
            padding: 8px 14px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(201, 11, 11, 0.35);
            transition: all 0.2s ease;
        }

        .btn-counter {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 2px;
        }

        .cnt-btn {
            background: var(--ruby-primary);
            color: #FFF;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cnt-num {
            font-size: 13px;
            font-weight: 800;
            padding: 0 8px;
            color: #FFF;
        }

        /* FLOATING CART BAR */
        .floating-cart {
            position: fixed;
            bottom: 20px;
            left: 16px;
            right: 16px;
            background: rgba(22, 22, 30, 0.95);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 215, 0, 0.15);
            z-index: 100;
            transform: translateY(140px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .floating-cart.active {
            transform: translateY(0);
        }

        .cart-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cart-badge-icon {
            position: relative;
            width: 44px;
            height: 44px;
            background: var(--ruby-grad);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: var(--shadow-glow);
        }

        .cart-badge-num {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--gold-primary);
            color: #000;
            font-size: 11px;
            font-weight: 900;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #16161E;
        }

        .cart-price-title {
            font-size: 11px;
            color: var(--text-sub);
        }

        .cart-price-val {
            font-size: 16px;
            font-weight: 900;
            color: #FFF;
        }

        .btn-checkout {
            background: var(--gold-grad);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.15 ease;
        }

        .btn-checkout:active {
            transform: scale(0.95);
        }

        /* MODAL POPUPS (PRODUCT DETAILS & CART) */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
        }

        .modal-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-sheet {
            width: 100%;
            max-height: 88vh;
            background: #121218;
            border-radius: 28px 28px 0 0;
            border-top: 1px solid var(--border-glow);
            padding: 24px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-backdrop.open .modal-sheet {
            transform: translateY(0);
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .modal-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .modal-detail-text {
            font-size: 13px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--gold-primary);
            margin-bottom: 6px;
            display: block;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            padding: 12px 14px;
            border-radius: 12px;
            color: #FFF;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--gold-primary);
        }

        .modal-close-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #FFF;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 800;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HEADER -->

    <!-- HERO PROMO BANNERS -->
    <div class="hero-banner-slider">
        <div class="banner-card">

    <!-- CATEGORIES TABS -->
    <div class="categories-bar">
        <button class="cat-chip active" onclick="filterCategory('all', this)">🔥 Barchasi</button>

    <!-- PRODUCTS GRID -->

        </div>
    </main>

    <!-- FLOATING CART BAR -->
    <div class="floating-cart" id="cartBar">
        <div class="cart-info">
            <div class="cart-badge-icon">
                🛒
                <span class="cart-badge-num" id="cartBadgeNum">0</span>
            </div>
            <div>
                <div class="cart-price-title">Jami to'lov:</div>

            </div>
        </div>
        <button class="btn-checkout" onclick="openCartModal()">
            Buyurtma berish ➔
        </button>
    </div>

    <!-- CART & CHECKOUT MODAL SHEET -->
    <div class="modal-backdrop" id="cartModalBackdrop">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <div class="modal-title">🛒 Savatingiz</div>
            
            <div id="modalCartItemsList" style="margin-bottom: 20px;">
                <!-- Cart items list dynamically rendered -->
            </div>

            <div class="input-group">
                <label class="input-label">📝 Buyurtmaga izoh (Ixtiyoriy):</label>
                <input type="text" id="orderComment" class="form-input" placeholder="Masalan: Qovurg'ani 2 ga bo'lib bering...">
            </div>

            <button class="btn-checkout" style="width: 100%; justify-content: center; padding: 16px; font-size: 16px;" onclick="sendOrderToBot()">
                ✅ Buyurtmani Telegramga yuborish
            </button>
            <button class="modal-close-btn" onclick="closeCartModal()">Yopish</button>
        </div>
    </div>

                priceStr: "195 000 so'm",
                tag: "HALOL 100%",
                img: "https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?auto=format&fit=crop&w=500&q=80"
            }
        ];

        let cart = {};
        let currentCategory = "all";

        // RENDER PRODUCTS
        function renderProducts(filter = "all", searchQuery = "") {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            let items = productsData;
            
            if (filter !== "all") {
                items = items.filter(p => p.category === filter);
            }

            if (searchQuery.trim() !== "") {
                const q = searchQuery.toLowerCase();
                items = items.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
            }

            if (items.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-sub); padding: 40px 0;">🔍 Mahsulot topilmadi</div>`;
                return;
            }

            items.forEach(p => {
                const count = cart[p.id] || 0;
                const card = document.createElement("div");
                card.className = "prod-card";
                
                card.innerHTML = `
                    <div class="prod-thumb-box">
                        <img src="${p.img}" alt="${p.name}" class="prod-thumb" onerror="this.src='https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&w=500&q=80'">
                        <span class="prod-tag">${p.tag}</span>
                    </div>
                    <div class="prod-content">
                        <div class="prod-title">${p.name}</div>
                        <div class="prod-desc">${p.desc}</div>
                        <div class="prod-bottom-row">
                            <div class="prod-price">${p.priceStr}</div>
                            <div id="btn-group-${p.id}">
                                ${renderButtonHTML(p.id, count)}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderButtonHTML(id, count) {
            if (count === 0) {
                return `<button class="btn-add" onclick="updateCart('${id}', 1)">+ Qo'shish</button>`;
            }
            return `
                <div class="btn-counter">
                    <button class="cnt-btn" onclick="updateCart('${id}', -1)">-</button>
                    <span class="cnt-num">${count}</span>
                    <button class="cnt-btn" onclick="updateCart('${id}', 1)">+</button>
                </div>
            `;
        }

        function updateCart(id, delta) {
            const current = cart[id] || 0;
            const updated = current + delta;

            if (updated <= 0) {
                delete cart[id];
            } else {
                cart[id] = updated;
            }

            const btnContainer = document.getElementById(`btn-group-${id}`);
            if (btnContainer) {
                btnContainer.innerHTML = renderButtonHTML(id, cart[id] || 0);
            }

            updateFloatingCart();

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("medium");
            }
        }

        function updateFloatingCart() {
            let totalCount = 0;
            let totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const p = productsData.find(i => i.id === id);
                if (p) {
                    const c = cart[id];
                    totalCount += c;
                    totalPrice += p.price * c;
                }
            });

            const cartBar = document.getElementById("cartBar");
            const numBadge = document.getElementById("cartBadgeNum");
            const priceVal = document.getElementById("cartPriceVal");

            numBadge.innerText = totalCount;
            priceVal.innerText = `${totalPrice.toLocaleString("ru-RU")} so'm`;

            if (totalCount > 0) {
                cartBar.classList.add("active");
            } else {
                cartBar.classList.remove("active");
            }
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll(".cat-chip").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            const searchVal = document.getElementById("searchInput").value;
            renderProducts(cat, searchVal);
        }

        function handleSearch() {
            const searchVal = document.getElementById("searchInput").value;
            renderProducts(currentCategory, searchVal);
        }

        // CART MODAL LOGIC
        function openCartModal() {
            const list = document.getElementById("modalCartItemsList");
            list.innerHTML = "";

            let totalSum = 0;

            Object.keys(cart).forEach(id => {
                const p = productsData.find(i => i.id === id);
                if (p) {
                    const count = cart[id];
                    const itemTotal = p.price * count;
                    totalSum += itemTotal;

                    const row = document.createElement("div");
                    row.style.cssText = "display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border-subtle);";
                    row.innerHTML = `
                        <div>
                            <div style="font-weight: 800; font-size: 14px;">${p.name}</div>
                            <div style="font-size: 12px; color: var(--gold-primary); margin-top: 2px;">${count} dona x ${p.priceStr} = ${itemTotal.toLocaleString("ru-RU")} so'm</div>
                        </div>
                        <div style="font-weight: 900; font-size: 15px;">${itemTotal.toLocaleString("ru-RU")} so'm</div>
                    `;
                    list.appendChild(row);
                }
            });

            const backdrop = document.getElementById("cartModalBackdrop");
            backdrop.classList.add("open");
        }

        function closeCartModal() {
            const backdrop = document.getElementById("cartModalBackdrop");
            backdrop.classList.remove("open");
        }

        // SUBMIT TO TELEGRAM BOT
        function sendOrderToBot() {
            const items = [];
            let totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const p = productsData.find(i => i.id === id);
                if (p) {
                    const count = cart[id];
                    const itemTotal = p.price * count;
                    totalPrice += itemTotal;
                    items.push({
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        count: count,
                        total: itemTotal
                    });
                }
            });

            if (items.length === 0) {
                alert("Savatingiz bo'sh!");
                return;
            }

            const comment = document.getElementById("orderComment").value || "Izoh yo'q";

            const payload = {
                items: items,
                total_price: totalPrice,
                total_count: items.reduce((acc, i) => acc + i.count, 0),
                comment: comment,
                date: new Date().toLocaleString("uz-UZ")
            };

            tg.sendData(JSON.stringify(payload));
        }

        // INITIAL RENDER
        renderProducts("all");
    </script>
</body>
</html>
