<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MEATBOX.UZ — Premium Go'sht Do'koni</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0D0D11;
            --bg-card: #16161E;
            --bg-card-hover: #1F1F2A;
            --primary: #9E0000;
            --primary-grad: linear-gradient(135deg, #B80000 0%, #7A0000 100%);
            --gold: #FFD700;
            --gold-grad: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --text-main: #FFFFFF;
            --text-muted: #9E9EA8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* HEADER SECTION */
        .header {
            background: linear-gradient(180deg, rgba(158, 0, 0, 0.25) 0%, rgba(13, 13, 17, 0) 100%);
            padding: 16px 16px 8px 16px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .brand-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: var(--primary-grad);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(158, 0, 0, 0.4);
        }

        .brand-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .badge-delivery {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: var(--gold);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* CATEGORIES TAB (STICKY) */
        .categories-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background: var(--primary-grad);
            color: #FFF;
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(158, 0, 0, 0.3);
        }

        /* PRODUCT LIST */
        .products-section {
            padding: 12px 16px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            position: relative;
        }

        .product-card:active {
            transform: scale(0.98);
        }

        .product-img-wrapper {
            width: 100%;
            height: 120px;
            position: relative;
            background: #252530;
            overflow: hidden;
        }

        .product-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tag-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            color: var(--gold);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .product-desc {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.3;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .product-price {
            font-size: 13px;
            font-weight: 800;
            color: var(--gold);
        }

        /* ADD / COUNTER BUTTONS */
        .add-btn {
            background: var(--primary-grad);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(158, 0, 0, 0.3);
            transition: all 0.2s ease;
        }

        .counter-btn-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 2px;
        }

        .cnt-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cnt-value {
            font-size: 13px;
            font-weight: 700;
            padding: 0 8px;
            color: #FFF;
        }

        /* FLOATING BOTTOM CART BAR */
        .bottom-cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: rgba(22, 22, 30, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            z-index: 100;
            transform: translateY(120px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bottom-cart-bar.active {
            transform: translateY(0);
        }

        .cart-bar-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-icon-badge {
            position: relative;
            width: 40px;
            height: 40px;
            background: var(--primary-grad);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--gold);
            color: #000;
            font-size: 11px;
            font-weight: 800;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-total-label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .cart-total-price {
            font-size: 15px;
            font-weight: 800;
            color: #FFF;
        }

        .order-action-btn {
            background: var(--gold-grad);
            color: #000;
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            transition: transform 0.1s ease;
        }

        .order-action-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="brand-bar">
            <div class="logo-group">
                <div class="logo-icon">🥩</div>
                <div>
                    <div class="brand-title">MEATBOX.UZ</div>
                    <div class="brand-subtitle">Premium Halol Go'shtlar</div>
                </div>
            </div>
            <div class="badge-delivery">
                ⚡️ 45 daqiqa
            </div>
        </div>
    </header>

    <!-- CATEGORIES -->
    <div class="categories-container">
        <button class="cat-btn active" onclick="filterCategory('all', this)">🔥 Barchasi</button>
        <button class="cat-btn" onclick="filterCategory('sets', this)">🥩 Setlar</button>
        <button class="cat-btn" onclick="filterCategory('steaks', this)">🔪 Steyklar</button>
        <button class="cat-btn" onclick="filterCategory('marinated', this)">🍢 Marinadlangan</button>
    </div>

    <!-- PRODUCTS SECTION -->
    <main class="products-section">
        <div class="section-title">
            <span>🔥</span> Mashhur Mahsulotlar
        </div>
        <div class="product-grid" id="productGrid">
            <!-- Dynamic products rendered via JS -->
        </div>
    </main>

    <!-- FLOATING CART BAR -->
    <div class="bottom-cart-bar" id="cartBar">
        <div class="cart-bar-info">
            <div class="cart-icon-badge">
                🛒
                <span class="badge-count" id="cartBadge">0</span>
            </div>
            <div>
                <div class="cart-total-label">Jami buyurtma:</div>
                <div class="cart-total-price" id="cartTotalPrice">0 so'm</div>
            </div>
        </div>
        <button class="order-action-btn" onclick="sendOrderData()">
            Buyurtma berish ➔
        </button>
    </div>

    <script>
        // Telegram Web App Initialization
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // PRODUCT DATA
        const productsData = [
            {
                id: "set_1",
                category: "sets",
                name: "🥩 Premium Steak Set",
                desc: "Ribeye 1kg, T-Bone 1kg, Tenderloin 0.5kg + Maxsus ziravorlar",
                price: 450000,
                priceStr: "450 000 so'm",
                tag: "TOP SALE",
                img: "images/steak_set.jpg"
            },
            {
                id: "set_2",
                category: "sets",
                name: "🔥 BBQ Grill Box",
                desc: "Marinadlangan qovurg'alar (2kg), kabob (2kg), nemis sosiskalari (1kg)",
                price: 380000,
                priceStr: "380 000 so'm",
                tag: "BBQ SET",
                img: "images/bbq_ribs.jpg"
            },
            {
                id: "set_3",
                category: "sets",
                name: "👨‍👩‍👧‍👦 Family Meat Box",
                desc: "Mol go'shti lahza 2kg, Qo'y go'shti 2kg, Qiymasi 1kg",
                price: 520000,
                priceStr: "520 000 so'm",
                tag: "OILAVIY",
                img: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: "set_4",
                category: "sets",
                name: "🍔 Burger & Steak Combo",
                desc: "Ribeye steyk (1kg), Burger kotletlari (8 dona), Maxsus sous",
                price: 320000,
                priceStr: "320 000 so'm",
                tag: "COMBO",
                img: "https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: "steak_ribeye",
                category: "steaks",
                name: "🥩 Prime Ribeye Steak",
                desc: "Juicy marble cut beef (1 kg / 3-4 dona steyk)",
                price: 190000,
                priceStr: "190 000 so'm",
                tag: "PREMIUM",
                img: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: "steak_tomahawk",
                category: "steaks",
                name: "🪓 Tomahawk Steak",
                desc: "Suyakli qirollik steyki (1.2 kg)",
                price: 240000,
                priceStr: "240 000 so'm",
                tag: "EXCLUSIVE",
                img: "https://images.unsplash.com/photo-1558030006-450675393462?auto=format&fit=crop&w=500&q=80"
            },
            {
                id: "mar_ribs",
                category: "marinated",
                name: "🔥 Marinadlangan Qovurg'a",
                desc: "Maxsus firmaniy sousda marinad qilingan mol qovurg'alari (1.5 kg)",
                price: 160000,
                priceStr: "160 000 so'm",
                tag: "GRILL",
                img: "images/bbq_ribs.jpg"
            },
            {
                id: "mar_shashlik",
                category: "marinated",
                name: "🍢 Shaslik uchun Marinad",
                desc: "Piyoz, ziravorlar va zaytun moyi bilan tayyor (2 kg)",
                price: 195000,
                priceStr: "195 000 so'm",
                tag: "HALOL 100%",
                img: "https://images.unsplash.com/photo-1529692236671-f1f6cf9683ba?auto=format&fit=crop&w=500&q=80"
            }
        ];

        // Cart state: { productId: count }
        let cart = {};

        // RENDER PRODUCTS
        function renderProducts(filter = "all") {
            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";

            const filtered = filter === "all" 
                ? productsData 
                : productsData.filter(p => p.category === filter);

            filtered.forEach(p => {
                const count = cart[p.id] || 0;
                
                const card = document.createElement("div");
                card.className = "product-card";
                
                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${p.img}" alt="${p.name}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&w=500&q=80'">
                        <span class="tag-badge">${p.tag}</span>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-footer">
                            <div class="product-price">${p.priceStr}</div>
                            <div id="action-${p.id}">
                                ${renderButtonHTML(p.id, count)}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderButtonHTML(id, count) {
            if (count === 0) {
                return `<button class="add-btn" onclick="updateCart('${id}', 1)">+ Qo'shish</button>`;
            }
            return `
                <div class="counter-btn-group">
                    <button class="cnt-btn" onclick="updateCart('${id}', -1)">-</button>
                    <span class="cnt-value">${count}</span>
                    <button class="cnt-btn" onclick="updateCart('${id}', 1)">+</button>
                </div>
            `;
        }

        function updateCart(id, delta) {
            const currentCount = cart[id] || 0;
            const newCount = currentCount + delta;

            if (newCount <= 0) {
                delete cart[id];
            } else {
                cart[id] = newCount;
            }

            // Update product card button HTML
            const actionContainer = document.getElementById(`action-${id}`);
            if (actionContainer) {
                actionContainer.innerHTML = renderButtonHTML(id, cart[id] || 0);
            }

            // Update floating cart bar
            updateCartBar();
            
            // Haptic Feedback for Telegram
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred("light");
            }
        }

        function updateCartBar() {
            let totalCount = 0;
            let totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const p = productsData.find(item => item.id === id);
                if (p) {
                    const count = cart[id];
                    totalCount += count;
                    totalPrice += p.price * count;
                }
            });

            const cartBar = document.getElementById("cartBar");
            const cartBadge = document.getElementById("cartBadge");
            const cartTotalPrice = document.getElementById("cartTotalPrice");

            cartBadge.innerText = totalCount;
            cartTotalPrice.innerText = `${totalPrice.toLocaleString("ru-RU")} so'm`;

            if (totalCount > 0) {
                cartBar.classList.add("active");
            } else {
                cartBar.classList.remove("active");
            }
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            renderProducts(cat);
        }

        // SEND ORDER TO TELEGRAM BOT
        function sendOrderData() {
            const items = [];
            let totalPrice = 0;

            Object.keys(cart).forEach(id => {
                const p = productsData.find(item => item.id === id);
                if (p) {
                    const count = cart[id];
                    const itemTotal = p.price * count;
                    totalPrice += itemTotal;
                    items.push({
                        id: p.id,
                        name: p.name,
                        price: p.price,
                        count: count,
                        total: itemTotal
                    });
                }
            });

            if (items.length === 0) {
                alert("Savatingiz bo'sh!");
                return;
            }

            const payload = {
                items: items,
                total_price: totalPrice,
                total_count: items.reduce((acc, i) => acc + i.count, 0),
                date: new Date().toLocaleString()
            };

            // Telegram WebApp sendData
            tg.sendData(JSON.stringify(payload));
        }

        // INITIAL RENDER
        renderProducts("all");
    </script>
</body>
</html>
